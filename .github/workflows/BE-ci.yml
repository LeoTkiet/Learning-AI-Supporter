name: Backend CI

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop

jobs:
    test:
        runs-on: ubuntu-lastest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Install dependencies
              run:
                python -m pip install --uprade pip
                pip install -r backend/requirements.txt
                pip install pytest
            